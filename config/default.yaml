# ==================== AUTO-TUNE ENGINE ====================
auto_tune:
  enabled: true
  mode: auto

  safety:
    # === MASTER SWITCH ===
    # false = TẮT hoàn toàn SafetyGuard (không check CPU/RAM/disk/temp)
    # Hữu ích khi đang debug hoặc đã có Defender exclusion.
    enabled: true

    # ---- Safety margins ----
    reserve_cpu_cores: 1
    reserve_ram_pct: 25
    reserve_ram_min_mb: 1024
    reserve_disk_pct: 10
    reserve_disk_min_mb: 2048

    # Ngưỡng riêng cho cache READ (link/copy từ cache → workspace).
    # Thấp hơn write vì chỉ cần đọc + (thường) link = 0 disk.
    reserve_disk_pct_cache_read: 3

    # ---- Throttle thresholds ----
    # 98% cho Windows+Defender. Hạ xuống 90 sẽ false positive liên tục.
    throttle_ram_pct: 85
    throttle_cpu_pct: 98
    throttle_disk_pct: 90
    throttle_temp_celsius: 85

    backoff_factor: 0.5
    backoff_min_workers: 1

    # ---- CPU measurement ----
    # "external" = system - own_tree (own_tree giờ include descendants
    #              + external tool processes apktool/apksigner/...)
    # "system"   = raw psutil.cpu_percent()
    cpu_measurement: external

    # ---- Prompt / reset semantics ----
    # Số vi phạm LIÊN TIẾP để trigger hành động (prompt/CLI fallback).
    prompt_after_n_violations: 5

    # Reset counter sau N lần check OK LIÊN TIẾP (chống reset do
    # dao động ngắn trên Windows). Counter không reset ngay lập tức.
    reset_after_ok_checks: 3

    # Timeout chờ user prompt (GUI). Hết timeout → auto-continue.
    prompt_timeout_sec: 60

    # Nâng ngưỡng bao nhiêu % khi user chọn Continue / cli action=continue.
    threshold_raise_pct: 5

    # Interval check (5s — smooth hơn 3s).
    check_interval_sec: 5

    # ---- CLI mode behavior (không có GUI) ----
    # "mute":     auto-mute reason, dùng full resources (RECOMMENDED cho CLI)
    # "continue": nâng ngưỡng + reset counter
    # "abort":    dừng pipeline
    cli_mode_action: mute