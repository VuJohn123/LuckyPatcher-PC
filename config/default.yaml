pipeline:
  apktool_jobs: null
  apktool_memory: "4096m"
  keep_workspace: true
  fast_mode: true
  use_gda: false

conversion:
  auto_convert_xapk: true
  auto_convert_apks: true
  allow_split_apk: true

signing:
  key_type: testkey
  forced_package_id: null

logging:
  level: INFO
  file: logs/pipeline.log
  max_bytes: 10485760
  backup_count: 5

cache:
  enabled: true
  dir: workspace/cache
  apk_analysis_ttl_days: 30
  decompiled_ttl_days: 7

network:
  connect_timeout: 10
  read_timeout: 60
  max_retries: 3
  backoff_factor: 1.5